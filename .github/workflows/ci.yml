# Pipeline d'intégration continue : lint et tests unitaires.
# Volontairement absents de cette CI (voir README, section « Intégration continue ») :
# - la suite `parcours` (jest.integration.config.js), qui exige une API joignable ;
# - le build Android, long et dépendant de secrets de signature.
name: ci
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  # Déclenchement manuel temporaire pour valider l'ajout de gitleaks sur
  # ci/github-actions (develop n'existe pas encore — tâche 13). Retiré une
  # fois le run vert confirmé.
  workflow_dispatch:

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json impose "engines.node": ">= 22.11.0" (l'adaptateur de test
          # node:sqlite l'exige) : Node 20, prévu au brief, est ici incompatible.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Tests unitaires
        run: npm test

  # Job séparé du job « Qualité et tests » — dont ni le nom ni la structure ne
  # doivent changer (référencés par les règles de protection de branche).
  secrets:
    name: Détection de secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # .gitleaks.toml : allowlist pour ios/Podfile.lock (SPEC CHECKSUMS
      # CocoaPods, SHA1 de podspecs publics — faux positif avéré).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
