# Pipeline d'intégration continue : lint et tests unitaires.
# Volontairement absents de cette CI (voir README, section « Intégration continue ») :
# - la suite `parcours` (jest.integration.config.js), qui exige une API joignable ;
# - le build Android, long et dépendant de secrets de signature.
name: ci
on:
  pull_request:
    branches: [develop, main]
  push:
    # NOTE TEMPORAIRE (retirée avant la version finale) : ci/github-actions ajoutée ici
    # uniquement pour obtenir une exécution réelle du pipeline sans ouvrir de PR, ni
    # pousser sur main. La liste finale ne comporte que [develop, main] comme prévu au brief.
    branches: [develop, main, ci/github-actions]

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json impose "engines.node": ">= 22.11.0" (l'adaptateur de test
          # node:sqlite l'exige) : Node 20, prévu au brief, est ici incompatible.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Tests unitaires
        run: npm test
